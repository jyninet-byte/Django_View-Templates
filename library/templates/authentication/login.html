{% extends 'base.html' %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="auth-wrap narrow">
  <div class="card">
    <h1>Welcome back</h1>
    <p class="muted">Log in with your email and password.</p>
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" name="email" value="{{ email }}" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>
  </div>
  <p class="auth-switch">No account yet? <a href="{% url 'register' %}">Sign up</a></p>
</div>
{% endblock %}
